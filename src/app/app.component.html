<header class="site-header" [class.is-scrolled]="scrolled">
	<div class="page nav-row">
		<a href="#home" class="brand" (click)="closeMenu()">
			<img src="assets/foto-perfil.jpeg" alt="" class="brand-photo" width="38" height="38" />
			<span class="brand-name">Raúl Silva</span>
		</a>

		<button type="button" class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen"
			aria-controls="site-nav">
			<span class="sr-only">Abrir menú</span>
			<span class="menu-bar"></span>
			<span class="menu-bar"></span>
		</button>

		<nav id="site-nav" class="site-nav" [class.is-open]="menuOpen" aria-label="Secciones">
			<a *ngFor="let link of links" [href]="'#' + link.id" (click)="closeMenu()">{{ link.label }}</a>
			<a href="assets/CV-Raul-Silva.pdf" download="CV-Raul-Silva.pdf" class="btn btn-primary nav-cv">
				Descargar CV
			</a>
		</nav>
	</div>
</header>

<main>
	<section id="home"><app-home></app-home></section>
	<section id="stack"><app-aboutme></app-aboutme></section>
	<section id="projects"><app-projects></app-projects></section>
	<section id="education"><app-education-experience></app-education-experience></section>
	<section id="contact"><app-contactme></app-contactme></section>
</main>

<footer class="site-footer">
	<div class="page footer-row">
		<span>© {{ year }} Raúl Silva</span>
		<span>Hecho con Angular en Quito, Ecuador</span>
	</div>
</footer>
