<div class="page contact">
	<div class="contact-main">
		<h2 class="contact-title">¿Tienes un proyecto o una vacante? Hablemos.</h2>
		<p class="contact-lead">Escríbeme por correo o WhatsApp y coordinamos una llamada.</p>
		<a class="contact-email" [href]="'mailto:' + email">{{ email }}</a>

		<div class="contact-actions">
			<a [href]="'mailto:' + email" class="btn btn-primary">Enviar un correo</a>
			<a href="assets/CV-Raul-Silva.pdf" download="CV-Raul-Silva.pdf" class="btn btn-outline">Descargar CV</a>
		</div>
	</div>

	<dl class="channels">
		<div *ngFor="let c of channels">
			<dt>{{ c.label }}</dt>
			<dd>
				<a [href]="c.url" [attr.target]="c.external ? '_blank' : null"
					[attr.rel]="c.external ? 'noopener' : null">{{ c.value }}</a>
			</dd>
		</div>
	</dl>
</div>
