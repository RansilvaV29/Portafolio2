<div class="page">
	<div class="section-head">
		<h2 class="section-title">Stack</h2>
		<p class="section-lead">Las herramientas que uso a diario para llevar un sistema desde el requisito hasta
			el servidor.</p>
	</div>

	<div class="stack-grid">
		<article *ngFor="let group of groups" class="stack-col">
			<h3>{{ group.title }}</h3>
			<p class="stack-note">{{ group.note }}</p>
			<ul class="stack-list">
				<li *ngFor="let tech of group.items">
					<span class="tech-icon" aria-hidden="true">
						<img *ngIf="tech.icon" [src]="tech.icon" alt="" loading="lazy" width="24" height="24" />
						<span *ngIf="!tech.icon" class="tech-initial">{{ tech.name.charAt(0) }}</span>
					</span>
					{{ tech.name }}
				</li>
			</ul>
		</article>
	</div>

	<div class="extra-grid">
		<div>
			<h3 class="extra-title">Cómo trabajo</h3>
			<ul class="practice-list">
				<li *ngFor="let p of practices">{{ p }}</li>
			</ul>
		</div>
		<div>
			<h3 class="extra-title">Idiomas</h3>
			<dl class="lang-list">
				<div *ngFor="let l of languages">
					<dt>{{ l.name }}</dt>
					<dd>{{ l.level }}</dd>
				</div>
			</dl>
		</div>
	</div>
</div>
